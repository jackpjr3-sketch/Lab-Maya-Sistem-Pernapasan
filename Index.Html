  <style>
    :root {
      --ink: #29445a;
      --muted: #718596;
      --cream: #f5fbfa;
      --teal: #78bfc0;
      --teal-dark: #4d858d;
      --coral: #f3aaa0;
      --sky: #d8f1f0;
      --gold: #f6d58b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      background-image:
        radial-gradient(circle at 10% 15%, rgba(216, 241, 240, 0.82) 0, transparent 24rem),
        radial-gradient(circle at 90% 90%, rgba(246, 213, 139, 0.28) 0, transparent 23rem);
      aspect-ratio: 16 / 9;
    }

    @media (max-width: 767px) {
      .app-shell { aspect-ratio: auto; }
    }

    .partner-logo {
      mix-blend-mode: multiply;
      filter: saturate(1.05) contrast(1.04);
    }

    .logo-row {
      gap: 0.5rem;
    }

    @media (min-width: 640px) {
      .logo-row { gap: 1rem; }
    }

    .logo-row .partner-logo {
      height: 5.75rem;
      max-height: 5.75rem;
      object-fit: contain;
    }

    @media (min-width: 640px) {
      .logo-row .partner-logo {
        height: 7rem;
        max-height: 7rem;
      }
    }

    .app-shell::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image: radial-gradient(#78bfc0 0.65px, transparent 0.65px);
      background-size: 20px 20px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    .screen {
      display: none;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      z-index: 1;
      animation: screenIn 0.5s ease both;
    }
    .screen.active { display: flex; }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .display-font { font-family: "Fraunces", serif; }
    .glass-card {
      border: 1px solid rgba(4, 127, 130, 0.15);
      box-shadow: 0 18px 44px rgba(20, 65, 75, 0.12);
      backdrop-filter: blur(10px);
    }

    .lab-button {
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }
    .lab-button:hover { transform: translateY(-3px); filter: brightness(1.03); }
    .lab-button:focus-visible,
    .menu-card:focus-visible,
    .organ-hotspot:focus-visible,
    .activity-choice:focus-visible {
      outline: 3px solid #f4b94f;
      outline-offset: 4px;
    }

    .lung-float { animation: breatheIdle 4.2s ease-in-out infinite; transform-origin: center; }
    @keyframes breatheIdle {
      0%, 100% { transform: scale(0.98); }
      50% { transform: scale(1.035); }
    }

    .menu-card {
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }
    .menu-card:hover {
      transform: translateY(-7px) rotate(-0.5deg);
      box-shadow: 0 20px 34px rgba(20, 65, 75, 0.16);
    }

    .organ-hotspot {
      cursor: pointer;
      transition: filter 0.2s ease, opacity 0.2s ease;
    }
    .organ-hotspot:hover,
    .organ-hotspot.selected { filter: drop-shadow(0 0 8px rgba(244,185,79,0.9)); }
    .organ-hotspot.selected { opacity: 1 !important; }

    .organ-panel { display: none; }
    .organ-panel.active { display: block; animation: screenIn 0.3s ease both; }

    .sim-stage {
      background:
        linear-gradient(rgba(255,255,255,0.88), rgba(234,250,248,0.95)),
        radial-gradient(circle at center, #d9f7f4 0, transparent 60%);
    }

    .sim-lungs { transform-origin: 50% 55%; transition: transform 1.1s cubic-bezier(.2,.8,.2,1); }
    .sim-diaphragm { transition: transform 1.1s cubic-bezier(.2,.8,.2,1); }
    .air-flow { opacity: 0; transition: opacity 0.35s ease; }
    .gas-pill { opacity: 0; transition: opacity 0.35s ease; }

    .sim-stage.inhale .sim-lungs { transform: scale(1.13, 1.1); }
    .sim-stage.inhale .sim-diaphragm { transform: translateY(22px); }
    .sim-stage.inhale .oxygen-flow,
    .sim-stage.exhale .carbon-flow,
    .sim-stage.inhale .oxygen-pill,
    .sim-stage.exhale .carbon-pill { opacity: 1; }

    .sim-stage.exhale .sim-lungs { transform: scale(0.88, 0.88); }
    .sim-stage.exhale .sim-diaphragm { transform: translateY(-18px); }

    .flow-dot { animation: flow 1.7s linear infinite; }
    @keyframes flow {
      from { stroke-dashoffset: 130; }
      to { stroke-dashoffset: 0; }
    }

    .activity-choice {
      border: 2px solid transparent;
      transition: 0.2s ease;
    }
    .activity-choice:hover { transform: translateY(-3px); }
    .activity-choice.selected {
      border-color: var(--teal);
      background: #d7f4ef;
      box-shadow: 0 8px 20px rgba(4,127,130,0.16);
    }

    .activity-choice .activity-icon {
      display: inline-block;
      transform-origin: center bottom;
    }
    .activity-choice.selected[data-activity="rest"] .activity-icon {
      animation: restSway 2.8s ease-in-out infinite;
    }
    .activity-choice.selected[data-activity="walk"] .activity-icon {
      animation: walkStep 0.8s ease-in-out infinite alternate;
    }
    .activity-choice.selected[data-activity="run"] .activity-icon {
      animation: runBounce 0.38s ease-in-out infinite alternate;
    }
    @keyframes restSway {
      0%, 100% { transform: rotate(-3deg) translateY(0); }
      50% { transform: rotate(3deg) translateY(-3px); }
    }
    @keyframes walkStep {
      from { transform: translateY(0) rotate(-5deg); }
      to { transform: translateY(-6px) rotate(5deg); }
    }
    @keyframes runBounce {
      from { transform: translateY(0) rotate(-8deg) scale(1); }
      to { transform: translateY(-9px) rotate(8deg) scale(1.08); }
    }

    .answer-box { display: none; }
    .answer-box.show { display: block; animation: screenIn 0.35s ease both; }

    @media (max-width: 640px) {
      .body-map { min-height: 470px; }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      const screens = document.querySelectorAll(".screen");
      function showScreen(id) {
        screens.forEach(screen => screen.classList.toggle("active", screen.id === id));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      document.getElementById("start-button").addEventListener("click", () => showScreen("intro-screen"));
      document.getElementById("menu-button").addEventListener("click", () => showScreen("menu-screen"));
      document.getElementById("organ-menu-card").addEventListener("click", () => showScreen("organ-screen"));
      document.getElementById("simulation-menu-card").addEventListener("click", () => showScreen("simulation-screen"));
      document.getElementById("experiment-menu-card").addEventListener("click", () => showScreen("experiment-screen"));
      document.querySelectorAll(".back-to-menu").forEach(button => button.addEventListener("click", () => showScreen("menu-screen")));
      const slideRoutes = {
        "intro-back-button": "lobby-screen", "intro-next-button": "menu-screen",
        "menu-back-button": "intro-screen", "menu-next-button": "organ-screen", "organ-back-button": "menu-screen",
        "organ-next-button": "simulation-screen", "simulation-back-button": "organ-screen", "simulation-next-button": "experiment-screen",
        "experiment-back-button": "simulation-screen", "experiment-next-button": "menu-screen"
      };
      Object.entries(slideRoutes).forEach(([buttonId, screenId]) => {
        document.getElementById(buttonId).addEventListener("click", () => showScreen(screenId));
      });

      function selectOrgan(name) {
        document.querySelectorAll(".organ-hotspot").forEach(item => {
          item.classList.toggle("selected", item.dataset.organ === name);
        });
        document.querySelectorAll(".organ-panel").forEach(panel => {
          panel.classList.toggle("active", panel.dataset.organPanel === name);
        });
      }

      document.querySelectorAll(".organ-hotspot").forEach(hotspot => {
        hotspot.addEventListener("click", () => selectOrgan(hotspot.dataset.organ));
        hotspot.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectOrgan(hotspot.dataset.organ);
          }
        });
      });

      const simStage = document.getElementById("sim-stage");
      const breathStatus = document.getElementById("breath-status");
      document.getElementById("inhale-button").addEventListener("click", () => {
        simStage.classList.remove("exhale");
        simStage.classList.add("inhale");
        breathStatus.textContent = "Inspirasi — udara kaya O₂ masuk";
      });
      document.getElementById("exhale-button").addEventListener("click", () => {
        simStage.classList.remove("inhale");
        simStage.classList.add("exhale");
        breathStatus.textContent = "Ekspirasi — udara kaya CO₂ keluar";
      });

      const activityData = {
        rest: { value: "14", description: "Tubuh berada dalam kondisi tenang." },
        walk: { value: "22", description: "Otot membutuhkan lebih banyak oksigen saat berjalan." },
        run: { value: "34", description: "Saat berlari, tubuh membutuhkan oksigen lebih cepat sehingga frekuensi napas meningkat." }
      };

      const frequencyValue = document.getElementById("frequency-value");
      const frequencyDescription = document.getElementById("frequency-description");
      document.querySelectorAll(".activity-choice").forEach(choice => {
        choice.addEventListener("click", () => {
          const data = activityData[choice.dataset.activity];
          document.querySelectorAll(".activity-choice").forEach(item => {
            item.classList.remove("selected");
            item.setAttribute("aria-pressed", "false");
          });
          choice.classList.add("selected");
          choice.setAttribute("aria-pressed", "true");
          frequencyValue.textContent = data.value;
          frequencyDescription.textContent = data.description;
        });
      });

    });
  </script>
